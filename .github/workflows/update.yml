name: Update DCA tracker

on:
  schedule:
    # US market closes at 16:00 ET. We run at 21:30 UTC = 16:30 ET (winter) or
    # 17:30 ET (summer).  This catches the close + 30min buffer on US
    # trading days (Mon-Fri).  Holidays are handled by the script
    # (it just refetches the same previous-trading-day data, which is fine).
    - cron: "30 21 * * 1-5"
  workflow_dispatch:  # allow manual run
  push:
    branches: [main]
    paths:
      - "fetch_data.py"
      - "dca_engine.py"
      - "build_site.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent runs from racing
concurrency:
  group: dca-update
  cancel-in-progress: false

jobs:
  build:
    name: Fetch prices & rebuild site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Fetch latest prices
        run: python fetch_data.py

      - name: Run DCA engine
        run: python dca_engine.py

      - name: Build static site
        run: python build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
