name: Update DCA Site

on:
  schedule:
    # Run at 21:30 UTC Mon-Fri (~04:30 China time, after US market close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pandas

      - name: Fetch data + compute DCA
        run: |
          cd $GITHUB_WORKSPACE
          python fetch_data.py
          python dca_engine.py
          python build_site.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      - name: Push to GitCode
        run: |
          git config user.name "kyfkevin"
          git config user.email "kyfkevin@users.noreply.gitcode.net"
          git remote add gitcode "https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.net/kyfkevin/nasdaq-dca-tracker.git" 2>/dev/null || true
          git add site/index.html site/data.json
          git commit -m "chore: daily update [skip ci]" || echo "no changes"
          git push gitcode HEAD:main
